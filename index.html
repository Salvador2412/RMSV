<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium PowerPoint Templates</title>
  <meta name="description" content="High-end, professionally crafted PowerPoint templates for business, creative, and minimalist presentations.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #05060B;
      --bg-navy: #0B1120;
      --purple: #8A2BE2;
      --cyan: #00E5FF;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --font-title: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg-deep); color: var(--text-primary); scroll-behavior: auto; }
    body {
      font-family: var(--font-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Lenis Smooth Scroll Setup */
    html.lenis { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
    .lenis.lenis-stopped { overflow: hidden; }

    /* Noise Overlay */
    .noise {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      opacity: 0.025; pointer-events: none; z-index: 1000; mix-blend-mode: overlay;
    }

    /* Ambient Glows */
    .glow { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 1; will-change: transform, opacity; }
    .glow-1 { width: 700px; height: 700px; background: radial-gradient(circle, rgba(138,43,226,0.35), transparent 65%); top: -15%; left: -10%; animation: driftGlow 22s infinite alternate ease-in-out; }
    .glow-2 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,229,255,0.25), transparent 60%); bottom: -15%; right: -10%; animation: driftGlow 28s infinite alternate-reverse ease-in-out; }
    .glow-3 { width: 450px; height: 450px; background: radial-gradient(circle, rgba(138,43,226,0.2), transparent 50%); top: 50%; left: 40%; transform: translate(-50%, -50%); opacity: 0.4; }
    @keyframes driftGlow { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px, 30px) scale(1.15); } }

    /* Canvas Particles */
    #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

    /* Parallax Layers */
    .parallax-container { position: relative; min-height: 180vh; width: 100%; perspective: 1200px; }
    .layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; align-items: center; justify-content: center; will-change: transform; }
    .layer-bg { z-index: 1; }
    .layer-mid { z-index: 2; }
    .layer-fg { z-index: 3; }

    /* Geometric Shapes */
    .shape { position: absolute; border: 1px solid rgba(255,255,255,0.06); border-radius: 50%; backdrop-filter: blur(4px); }
    .shape-bg-1 { width: 40vw; height: 40vw; max-width: 600px; max-height: 600px; background: radial-gradient(circle, rgba(11,17,32,0.6), transparent); filter: blur(80px); }
    .shape-1 { width: 160px; height: 160px; top: 18%; left: 8%; background: conic-gradient(from 0deg, transparent, rgba(0,229,255,0.1), transparent); animation: spinSlow 40s linear infinite; }
    .shape-2 { width: 110px; height: 110px; bottom: 25%; right: 10%; border-radius: 20px; background: radial-gradient(circle, rgba(138,43,226,0.12), transparent); }
    .shape-3 { width: 220px; height: 220px; top: 60%; left: 65%; border: none; background: radial-gradient(circle, rgba(255,255,255,0.05), transparent); animation: spinSlow 30s linear infinite reverse; }
    @keyframes spinSlow { to { transform: rotate(360deg); } }

    /* Content */
    .content { position: relative; z-index: 10; min-height: 180vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6rem 1.5rem; }
    .hero { text-align: center; max-width: 900px; margin-bottom: 10vh; }
    .title {
      font-family: var(--font-title); font-size: clamp(3.2rem, 9vw, 7.5rem); font-weight: 700; line-height: 1.02;
      letter-spacing: -0.035em; text-align: center;
      background: linear-gradient(180deg, #FFFFFF 0%, #E2E8F0 40%, #64748B 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 30px rgba(138,43,226,0.25));
    }
    .subtitle {
      font-size: clamp(1.05rem, 2.2vw, 1.45rem); color: var(--text-secondary); margin-top: 1.8rem;
      font-weight: 300; letter-spacing: 0.015em; line-height: 1.5;
    }

    /* Buttons Container */
    .buttons-wrapper { position: relative; width: 100%; max-width: 1280px; display: flex; flex-direction: column; gap: 2.5rem; align-items: center; margin-top: 4vh; }
    @media (min-width: 850px) {
      .buttons-wrapper { flex-direction: row; justify-content: center; gap: 4rem; flex-wrap: wrap; }
    }

    /* Glass Buttons */
    .glass-btn {
      position: relative; width: 100%; max-width: 380px;
      padding: 1.6rem 2.2rem;
      background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      color: var(--text-primary); text-decoration: none;
      font-family: var(--font-body); font-weight: 500; font-size: clamp(1rem, 2vw, 1.15rem);
      letter-spacing: 0.01em; text-align: center;
      transition: transform 0.35s var(--ease-out), box-shadow 0.35s var(--ease-out), border-color 0.35s var(--ease-out);
      cursor: pointer; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .glass-btn::before {
      content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1px;
      background: linear-gradient(135deg, rgba(0,229,255,0.4), rgba(138,43,226,0.4));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0; transition: opacity 0.35s ease; pointer-events: none;
    }
    .glass-btn::after {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(0,229,255,0.15), transparent 60%);
      opacity: 0; transition: opacity 0.4s ease; transform: scale(0.6); pointer-events: none;
    }
    .glass-btn:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(0,229,255,0.3);
      box-shadow: 0 12px 50px rgba(0,0,0,0.5), 0 0 40px rgba(0,229,255,0.15), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .glass-btn:hover::before { opacity: 1; }
    .glass-btn:hover::after { opacity: 1; }
    
    .btn-label { display: block; font-weight: 600; margin-bottom: 4px; }
    .btn-hint { display: block; font-size: 0.8rem; color: var(--text-secondary); font-weight: 400; opacity: 0.8; }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>

  <div class="noise"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
  <canvas id="particleCanvas"></canvas>

  <div class="parallax-container">
    <div class="layer layer-bg" data-speed="0.15"><div class="shape shape-bg-1"></div></div>
    <div class="layer layer-mid" data-speed="0.45">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
    </div>
    <div class="layer layer-fg" data-speed="0.75"><div class="shape shape-3"></div></div>

    <main class="content">
      <div class="hero">
        <h1 class="title">PowerPoint<br>Templates</h1>
        <p class="subtitle">Professional presentation assets crafted for impact.</p>
      </div>

      <div class="buttons-wrapper">
        <a href="https://mega.nz/file/2x1iTJTK#f-r6ffkj8xELV2XnHxNSQ6fhBDnbkCgjklG4vW1bmXA" class="glass-btn" data-magnetic data-depth="1">
          <span class="btn-label">Personal Templates</span>
          <span class="btn-hint">My files</span>
        </a>
        <a href="https://mega.nz/file/m5kxBCyT#R-M6OSUt0BaClnhBQo9wfnbMosiZAi5PnJL7Pyq3LfQ" class="glass-btn" data-magnetic data-depth="2">
          <span class="btn-label">Download Templates</span>
          <span class="btn-hint">Web Templates</span>
        </a>
        <a href="https://mega.nz/file/e1NnXbjK#twEdrY9472V099Dkgkzc0BB6gAIqgjrBS2jmfEM_x8w" class="glass-btn" data-magnetic data-depth="3">
          <span class="btn-label">Resources</span>
          <span class="btn-hint">Videos • Audio • Photos</span>
        </a>
      </div>
    </main>
  </div>

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!-- Lenis Smooth Scroll -->
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

  <script>
    // Initialize Smooth Scroll
    const lenis = new Lenis({ duration: 1.3, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), orientation: 'vertical', smoothWheel: true });
    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);

    gsap.registerPlugin(ScrollTrigger);

    // Sync Lenis with ScrollTrigger
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);

    // Mouse Parallax with Inertia
    const layers = document.querySelectorAll('.layer');
    let mouse = { x: 0, y: 0 };
    let target = { x: 0, y: 0 };
    let current = { x: 0, y: 0 };

    document.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
      mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    gsap.ticker.add(() => {
      current.x += (mouse.x - current.x) * 0.06;
      current.y += (mouse.y - current.y) * 0.06;

      layers.forEach(layer => {
        const speed = parseFloat(layer.dataset.speed);
        const x = current.x * 50 * speed;
        const y = current.y * 50 * speed;
        gsap.set(layer, { x, y, force3D: true });
      });
    });

    // Scroll-Based Depth Animations
    const scrollTL = gsap.timeline({
      scrollTrigger: { trigger: '.content', start: 'top top', end: 'bottom top', scrub: 1.2 }
    });
    scrollTL
      .to('.title', { yPercent: -35, scale: 1.05, opacity: 0.8, ease: 'none' }, 0)
      .to('.subtitle', { yPercent: -25, opacity: 0.6, ease: 'none' }, 0)
      .to('.buttons-wrapper', { yPercent: -15, scale: 1.02, ease: 'none' }, 0)
      .to('.layer-fg', { opacity: 0.4, filter: 'blur(8px)', ease: 'none' }, 0)
      .to('.layer-mid', { opacity: 0.6, ease: 'none' }, 0)
      .to('.glow-1', { xPercent: 15, yPercent: 10, ease: 'none' }, 0)
      .to('.glow-2', { xPercent: -10, yPercent: -15, ease: 'none' }, 0);

    // Entry Reveal
    gsap.from('.title', { y: 60, opacity: 0, duration: 1.4, ease: 'power3.out', delay: 0.3 });
    gsap.from('.subtitle', { y: 30, opacity: 0, duration: 1.2, ease: 'power3.out', delay: 0.6 });
    gsap.from('.glass-btn', {
      y: 40, opacity: 0, stagger: 0.15, duration: 1, ease: 'power3.out', delay: 0.9,
      scrollTrigger: { trigger: '.buttons-wrapper', start: 'top 85%' }
    });

    // Magnetic Button Interaction
    document.querySelectorAll('[data-magnetic]').forEach(btn => {
      btn.addEventListener('mousemove', (e) => {
        const rect = btn.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        gsap.to(btn, { x: x * 0.35, y: y * 0.35, duration: 0.3, ease: 'power2.out', force3D: true });
        gsap.to(btn.querySelector('::after'), { scale: 0.8, duration: 0.3 });
      });
      btn.addEventListener('mouseleave', () => {
        gsap.to(btn, { x: 0, y: 0, duration: 0.6, ease: 'elastic.out(1, 0.4)', force3D: true });
      });
    });

    // Canvas Particles System
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, particles = [];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.vx = (Math.random() - 0.5) * 0.25;
        this.vy = (Math.random() - 0.5) * 0.25;
        this.size = Math.random() * 1.5 + 0.3;
        this.alpha = Math.random() * 0.4 + 0.05;
        this.color = Math.random() > 0.5 ? '#8A2BE2' : '#00E5FF';
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > w) this.vx *= -1;
        if (this.y < 0 || this.y > h) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.alpha;
        ctx.fill();
      }
    }

    for (let i = 0; i < 70; i++) particles.push(new Particle());

    function loop() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
